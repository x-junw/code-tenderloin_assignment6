<!DOCTYPE html>
<html>
    <head>
        <title>Cities</title>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="../public/cities.css" />
        <link rel="stylesheet" href="../public/navbar.css" />
        <script src="../public/load.js"></script>
    </head>
    <body>
        <div id="black-screen"></div>
        <div id="map">
            <h1 id="select">Select a city.</h1>
        </div>
        <div id="info">
            <div id="whitespace-fix"></div>
            <div id="desc">
                <h1 id="city-name"></h1>
                <p id="city-description"></p>
            </div>
            <div id="statistics">
                <div id="population">
                    <h1>Population</h1>
                    <h2 id="pop"><h2>
                </div>
                <div id="area">
                    <h1>Area</h1>
                    <h2 id="ar"><h2>
                </div>
                <div id="gdp-per-capita">
                    <h1>GDP Per Capita</h1>
                    <h2 id="gdppc"></h2>
                </div>
            </div>
            <div id="sec-list">
                <h1>Tourist Spots</h1>
                <div id="list">
                    <div class="card" id="tcard1">
                        <h1 class="cardh"></h1>
                        <img class="card-img"/>
                    </div>
                    <div class="card" id="tcard2">
                        <h1 class="cardh"></h1>
                        <img class="card-img"/>
                    </div>
                    <div class="card" id="tcard3">
                        <h1 class="cardh"></h1>
                        <img class="card-img"/>
                    </div>
                </div>
            </div>
            <div id="sec-list">
                <h1>Popular Dishes</h1>
                <div id="list">
                    <div class="card" id="dcard1">
                        <h1 class="cardh"></h1>
                        <img class="card-img"/>
                    </div>
                    <div class="card" id="dcard2">
                        <h1 class="cardh"></h1>
                        <img class="card-img"/>
                    </div>
                    <div class="card" id="dcard3">
                        <h1 class="cardh"></h1>
                        <img class="card-img"/>
                    </div>
                </div>
            </div>
            <div id="bottom">
                <button id="back-top-button" onclick="backToTop()">Back to the Top ↑</button>
            </div>
        </div>
    </body>
</html>
